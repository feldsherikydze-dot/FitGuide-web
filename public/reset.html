<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FitGuide — обновление</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0c; color: #f2f2f2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .box { max-width: 420px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { font-size: 15px; line-height: 1.45; color: #b9b9bd; margin: 0 0 8px; }
    code { color: #9be15d; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Обновляем приложение…</h1>
    <p id="status">Сбрасываем старый кэш.</p>
  </div>
  <script>
    // Страница помощи: сносит service worker и все кэши этого сайта,
    // чтобы телефон не показывал старую версию приложения.
    (async () => {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
          status.textContent = `Воркеров снято: ${regs.length}. Чистим кэш…`;
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
          status.textContent = `Кэшей удалено: ${keys.length}. Открываем заново…`;
        }
        // Данные (профиль, тренировки) в localStorage — их не трогаем.
        setTimeout(() => { location.replace('./'); }, 700);
      } catch (e) {
        status.textContent = 'Не получилось автоматически: ' + e.message;
      }
    })();
  </script>
</body>
</html>
